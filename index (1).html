<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo Rooms</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Ludo Rooms</h1>
<p class="sub">Make a room, send the code, play with 2–4 friends. No sign-up.</p>

<section id="home">
  <div class="card">
    <label for="name">Your name</label>
    <input id="name" maxlength="12" placeholder="e.g. Aman" autocomplete="off">
    <div class="row"><button id="create">Create room</button></div>
    <div class="or">or join a friend’s room</div>
    <label for="code" class="hidden">Room code</label>
    <input id="code" maxlength="5" placeholder="CODE" autocomplete="off">
    <div class="row"><button class="alt" id="join">Join room</button></div>
  </div>
</section>

<section id="room" class="hidden">
  <div class="card">
    <label>Room code — share it, or copy the link</label>
    <div class="roomcode" id="rc"></div>
    <div class="row"><button class="alt" id="copyc">Copy code</button><button class="alt" id="copyl">Copy link</button></div>
  </div>
  <div class="card">
    <label>Players (<span id="pc">0</span>/4)</label>
    <ul class="plist" id="plist"></ul>
    <div class="row"><button id="start">Start game</button></div>
    <p class="sub" id="wait" style="margin:12px 0 0"></p>
  </div>
</section>

<section id="game" class="hidden">
  <div class="chips" id="chips"></div>
  <div id="board">
    <div class="base" style="left:0;top:0;background:var(--c0)"><i></i></div>
    <div class="base" style="right:0;top:0;background:var(--c1)"><i></i></div>
    <div class="base" style="right:0;bottom:0;background:var(--c2)"><i></i></div>
    <div class="base" style="left:0;bottom:0;background:var(--c3)"><i></i></div>
    <div id="grid"></div><div id="ctr"></div><div id="pieces"></div>
  </div>
  <div class="dock">
    <button id="die" aria-label="Roll the dice">🎲</button>
    <div id="msg"></div>
  </div>
  <div class="row" id="again" style="display:none"><button id="back">Back to lobby</button></div>
</section>
</main>
<div id="toast" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="script.js"></script>
</body>
</html>
